plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zim.nfctag'
    compileSdk 35
    defaultConfig {
        applicationId 'com.zim.nfctag'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError true
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
